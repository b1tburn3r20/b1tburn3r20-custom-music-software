name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: No credentials in the build
        run: node scripts/check-secrets.cjs dist

  e2e:
    name: Drive the app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - name: Allow Electron's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npx playwright test
      - name: End-to-end tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.name }}
          path: test-results/screens

  secrets:
    name: No credentials in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package and smoke test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-latest }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --include=dev
      - run: npm run electron:pack
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Smoke test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke

  scripts:
    name: Lint install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck installer/install.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path installer/install.ps1 -Severity Error
          $issues | Format-Table
          if ($issues) { exit 1 }

  install:
    name: Real install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Ubuntu 24.04, os: ubuntu-24.04 }
          - { name: macOS arm64, os: macos-latest }
          - { name: macOS x64, os: macos-15-intel }
    env:
      B1T_INSTALL_ROOT: ${{ github.workspace }}/install root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node scripts/make-release.cjs release-assets --worktree
      - name: Libraries Electron needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libcups2t64 libgtk-3-0 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2
      - name: Check only (Unix)
        if: runner.os != 'Windows'
        run: sh release-assets/install.sh --check-only
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: B1T_SOURCE_TARBALL=release-assets/source.tar.gz xvfb-run --auto-servernum sh release-assets/install.sh --yes --no-launch
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: B1T_SOURCE_TARBALL=release-assets/source.tar.gz sh release-assets/install.sh --yes --no-launch
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:B1T_SOURCE_TARBALL = "release-assets\source.tar.gz"
          $env:B1T_SOURCE_TARBALL = (Resolve-Path $env:B1T_SOURCE_TARBALL).Path
          & release-assets\install.ps1 -Yes -NoLaunch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Uninstall (Unix)
        if: runner.os != 'Windows'
        run: sh release-assets/install.sh --uninstall --yes
      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & release-assets\install.ps1 -Uninstall -Yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
